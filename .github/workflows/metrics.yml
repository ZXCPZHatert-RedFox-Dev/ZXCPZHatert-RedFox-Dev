name: Update Profile Stats SVG
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          filename: generated/overview.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ZXCPZHatert-RedFox-Dev
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Moscow
          config_display: dark
          config_twemoji: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          extras_features: yes
          extras_css: |
            svg { background-color: #0d1117 !important; --color-text-link: #ff2a2a !important; --color-accent-fg: #ff2a2a !important; --color-icon-primary: #ff2a2a !important; }
            .h2, h2, .title { color: #ff2a2a !important; fill: #ff2a2a !important; }
            svg path { fill: #ff2a2a !important; }
            .calendar rect[fill^="#"] { fill: #ff2a2a !important; }
            .calendar rect[fill="#161b22"], .calendar rect[fill="#ebedf0"] { fill: #1f1215 !important; }
