name: Update Profile Stats SVG
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          filename: generated/overview.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ZXCPZHatert-RedFox-Dev
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Moscow
          config_display: dark
          config_twemoji: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
      - name: Recolor SVG to Red-Fox Red
        run: |
          sed -i -E "s/#539bf5|#58a6ff|#39d353|#26a641/#ff2a2a/gi; s/#006d32|#0e4429/#991b1b/gi" generated/overview.svg
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add generated/overview.svg
          git commit -m "Recolor overview.svg to Red-Fox red" || true
          git push || true
